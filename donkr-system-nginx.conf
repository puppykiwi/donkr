# Donkr Nginx Site Configuration
# Copy or symlink to /etc/nginx/sites-available/donkr
# sudo ln -s /etc/nginx/sites-available/donkr /etc/nginx/sites-enabled/
# sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name donkr.local localhost;

    root /opt/donkr/public;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"Donkr","bray":"HEE-HAW!"}\n';
    }
}

