# Donkr Standalone Nginx Configuration
# Runs unprivileged as current user on port 8080

worker_processes auto;
pid /opt/donkr/logs/nginx.pid;
error_log /opt/donkr/logs/error.log warn;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories for unprivileged execution
    client_body_temp_path /opt/donkr/temp/body;
    proxy_temp_path /opt/donkr/temp/proxy;
    fastcgi_temp_path /opt/donkr/temp/fastcgi;
    uwsgi_temp_path /opt/donkr/temp/uwsgi;
    scgi_temp_path /opt/donkr/temp/scgi;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /opt/donkr/logs/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    server {
        listen 8080 default_server;
        server_name localhost donkr.local _;

        root /opt/donkr/public;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Static file caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|json)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # Main route
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Donkey JSON API / Static Data
        location /data/ {
            alias /opt/donkr/public/data/;
            add_header Access-Control-Allow-Origin *;
            add_header Content-Type application/json;
        }

        # Healthcheck endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","app":"Donkr","bray":"HEE-HAW!","port":8080}\n';
        }

        # Custom error page
        error_page 404 /index.html;
    }
}
